<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nano-solid</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/ui.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--ns-bg);
        color: var(--ns-ink);
        font-family: var(--ns-font-sans);
      }
      #app {
        width: min(100%, 24rem);
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="ns-card">
        <div class="ns-card-header">
          <h1 class="ns-card-title">nano-solid 计数器</h1>
        </div>
        <div class="ns-counter-display">
          <span class="ns-counter-label">当前计数</span>
          <span id="counter" class="ns-counter-value">0</span>
        </div>
        <div class="ns-actions">
          <button id="increment" type="button" class="ns-btn">+1</button>
          <button id="decrement" type="button" class="ns-btn">-1</button>
          <button id="reset" type="button" class="ns-btn">重置</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
